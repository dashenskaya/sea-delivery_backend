<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Лента морских маршрутов</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="/static/styles/sea_routes.css">
</head>

<body>

<main class="phone feed-page">

    <video
    class="feed-video"
    autoplay
    loop
    playsinline
    poster="{{ .seaRoute.ImageURL }}">

    {{ if .seaRoute.VideoURL }}
    <source
        src="{{ .seaRoute.VideoURL }}"
        type="video/mp4">
    {{ end }}

    </video>

    <header class="feed-header">
        Морские маршруты
    </header>

    <aside class="feed-side-panel">

        <label class="like-control">
            <input class="like-checkbox" type="checkbox">

            <span class="heart-outline">♡</span>
            <span class="heart-filled">♥</span>

            <span class="side-value">
                {{ .seaRoute.LikesCount }}
            </span>
        </label>

        <div class="route-parameter">
            <span class="parameter-icon">↔</span>

            <span class="side-value">
                {{ .seaRoute.DistanceNauticalMiles }}
            </span>

            <span class="side-unit">
                мор. миль
            </span>
        </div>

        <div class="route-parameter">
            <span class="parameter-icon">◷</span>

            <span class="side-value">
                {{ .seaRoute.AveragePortDelayHours }}
            </span>

            <span class="side-unit">
                ч
            </span>
        </div>

        <a
            class="next-route"
            href="/sea_routes/feed?sea_route_id={{ .seaRoute.ID }}&next=true">
            ↓
        </a>

    </aside>

    <section class="feed-info">

        <h1 class="feed-title">
            {{ .seaRoute.DeparturePort }} → {{ .seaRoute.ArrivalPort }}
        </h1>

        <details class="route-description">

            <summary>
                <span class="description-preview">
                    {{ .seaRoute.Description }}
                </span>

                <span class="description-toggle"></span>
            </summary>

            <p class="description-full">
                {{ .seaRoute.Description }}
            </p>

        </details>

    </section>

    <nav class="bottom-nav">

        <a href="/sea_routes/feed" class="nav-item active">
            <span class="nav-icon">⌂</span>
            <span>Лента</span>
        </a>

        <a href="/sea_routes/add" class="nav-item">
            <span class="nav-icon">＋</span>
            <span>Добавить</span>
        </a>

        <a href="/sea_routes/catalog" class="nav-item">
            <span class="nav-icon">▦</span>
            <span>Каталог</span>
        </a>

    </nav>

</main>

</body>
</html>
