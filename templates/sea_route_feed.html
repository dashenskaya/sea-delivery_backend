<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Лента морских маршрутов</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="/static/styles/style.css">
</head>

<body>

<main class="phone feed-page">

    <video
        class="feed-video"
        src="{{ .seaRoute.VideoURL }}"
        poster="{{ .seaRoute.ImageURL }}"
        autoplay
        muted
        loop
        playsinline>
    </video>

    <header class="feed-header">
        Морские маршруты
    </header>

    <div class="feed-actions">

        <label class="like-control">

            <input
                class="like-checkbox"
                type="checkbox">

            <span class="heart-outline">♡</span>
            <span class="heart-filled">♥</span>

            <span class="like-count">
                {{ .seaRoute.LikesCount }}
            </span>

        </label>

        <a
            class="next-route"
            href="/sea-routes/feed?sea_route_id={{ .seaRoute.ID }}&next=true">

            ↓

        </a>

    </div>

    <section class="feed-info">

        <h1 class="feed-title">
            {{ .seaRoute.DeparturePort }} → {{ .seaRoute.ArrivalPort }}
        </h1>

        <div class="feed-properties">

            <span>
                {{ .seaRoute.DistanceNauticalMiles }} мор. миль
            </span>

            <span>
                Средняя задержка:
                {{ .seaRoute.AveragePortDelayHours }} ч
            </span>

        </div>

        <details class="route-description">

            <summary></summary>

            <p>
                {{ .seaRoute.Description }}
            </p>

        </details>

    </section>

    <nav class="bottom-nav">

        <a
            href="/sea-routes/feed"
            class="nav-item active">

            <span class="nav-icon">⌂</span>
            <span>Лента</span>

        </a>

        <a
            href="/sea-routes/add"
            class="nav-item">

            <span class="nav-icon">＋</span>
            <span>Добавить</span>

        </a>

        <a
            href="/sea-routes/catalog"
            class="nav-item">

            <span class="nav-icon">▦</span>
            <span>Каталог</span>

        </a>

    </nav>

</main>

</body>
</html>
