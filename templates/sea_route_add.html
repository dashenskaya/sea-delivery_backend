<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Добавление морского маршрута</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="/static/styles/style.css">
</head>

<body>

<main class="phone standard-page">

    <header class="page-header">
        Морские маршруты
    </header>

    <section class="page-content add-content">

        <h1 class="page-title">
            Новый маршрут
        </h1>

        <form class="route-form">

            <div class="form-group">

                <label>
                    Медиа
                </label>

                <div class="media-grid">

                    <label
                        class="media-photo"
                        data-current-image="{{ .seaRoute.ImageURL }}">

                        <img
                            src="{{ .seaRoute.ImageURL }}"
                            alt="{{ .seaRoute.DeparturePort }} — {{ .seaRoute.ArrivalPort }}">

                        <input
                            class="media-file-input"
                            type="file"
                            accept="image/*">

                    </label>

                    <label
                        class="media-video"
                        data-current-video="{{ .seaRoute.VideoURL }}">

                        <span>
                            + Видео
                        </span>

                        <input
                            class="media-file-input"
                            type="file"
                            accept="video/*">

                    </label>

                </div>

            </div>

            <div class="form-group">

                <label for="departure-port">
                    Порт отправления
                </label>

                <input
                    id="departure-port"
                    type="text"
                    value="{{ .seaRoute.DeparturePort }}">

            </div>

            <div class="form-group">

                <label for="arrival-port">
                    Порт назначения
                </label>

                <input
                    id="arrival-port"
                    type="text"
                    value="{{ .seaRoute.ArrivalPort }}">

            </div>

            <div class="form-group">

                <label for="distance-nautical-miles">
                    Расстояние маршрута
                </label>

                <div class="input-with-unit">

                    <input
                        id="distance-nautical-miles"
                        type="number"
                        value="{{ .seaRoute.DistanceNauticalMiles }}">

                    <span>
                        мор. миль
                    </span>

                </div>

            </div>

            <div class="form-group">

                <label for="average-port-delay-hours">
                    Средняя задержка в портах
                </label>

                <div class="input-with-unit">

                    <input
                        id="average-port-delay-hours"
                        type="number"
                        value="{{ .seaRoute.AveragePortDelayHours }}">

                    <span>
                        ч
                    </span>

                </div>

            </div>

            <div class="form-group">

                <label for="description">
                    Описание
                </label>

                <textarea
                    id="description"
                    rows="3">{{ .seaRoute.Description }}</textarea>

            </div>

            <button
                class="main-button"
                type="button">

                ДОБАВИТЬ МАРШРУТ

            </button>

        </form>

    </section>

    <nav class="bottom-nav">

        <a
            href="/sea-routes/feed"
            class="nav-item">

            <span class="nav-icon">⌂</span>
            <span>Лента</span>

        </a>

        <a
            href="/sea-routes/add"
            class="nav-item active">

            <span class="nav-icon">＋</span>
            <span>Добавить</span>

        </a>

        <a
            href="/sea-routes/catalog"
            class="nav-item">

            <span class="nav-icon">▦</span>
            <span>Каталог</span>

        </a>

    </nav>

</main>

</body>
</html>
