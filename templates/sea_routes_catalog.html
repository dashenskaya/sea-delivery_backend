<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Каталог морских маршрутов</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="/static/styles/sea_routes.css">
</head>

<body>

<main class="phone standard-page">

    <header class="page-header">
        Морские маршруты
    </header>

    <section class="page-content catalog-content">

        <h1 class="page-title">
            Каталог маршрутов
        </h1>

        <form
            class="range-filter"
            method="GET"
            action="/sea_routes/catalog">

            <div class="range-area">

                <div class="range-heading">

                    <span>
                        от {{ .minDistanceNauticalMiles }}
                    </span>

                    <span>
                        до {{ .maxDistanceNauticalMiles }} мор. миль
                    </span>

                </div>

                <div class="double-range">

                    <input
                        class="range-input range-min"
                        type="range"
                        name="min_distance_nautical_miles"
                        min="0"
                        max="16000"
                        step="100"
                        value="{{ .minDistanceNauticalMiles }}">

                    <input
                        class="range-input range-max"
                        type="range"
                        name="max_distance_nautical_miles"
                        min="0"
                        max="16000"
                        step="100"
                        value="{{ .maxDistanceNauticalMiles }}">

                </div>

            </div>

            <button
                class="filter-button"
                type="submit">
                найти
            </button>

        </form>

        <div class="route-grid">

            {{ range .seaRoutes }}

            <a
                class="route-card"
                href="/sea_routes/feed?sea_route_id={{ .ID }}"
                data-image-url="{{ .ImageURL }}"
                data-video-url="{{ .VideoURL }}">

                <img
                    class="route-card-image"
                    src="{{ .ImageURL }}"
                    alt="{{ .DeparturePort }} — {{ .ArrivalPort }}">

                <div class="route-card-content">

                    <div class="route-card-heading">

                        <div>

                            <h2>
                                {{ .DeparturePort }}
                            </h2>

                            <p class="route-destination">
                                → {{ .ArrivalPort }}
                            </p>

                        </div>

                        <div class="card-like">

                            <span>♡</span>

                            <small>
                                {{ .LikesCount }}
                            </small>

                        </div>

                    </div>

                    <p class="route-distance">
                        {{ .DistanceNauticalMiles }} мор. миль
                    </p>

                    <span class="route-more">
                        Подробнее →
                    </span>

                </div>

            </a>

            {{ end }}

        </div>

    </section>

    <nav class="bottom-nav">

        <a href="/sea_routes/feed" class="nav-item">
            <span class="nav-icon">⌂</span>
            <span>Лента</span>
        </a>

        <a href="/sea_routes/add" class="nav-item">
            <span class="nav-icon">＋</span>
            <span>Добавить</span>
        </a>

        <a href="/sea_routes/catalog" class="nav-item active">
            <span class="nav-icon">▦</span>
            <span>Каталог</span>
        </a>

    </nav>

</main>

</body>
</html>
