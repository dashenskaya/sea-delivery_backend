<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <title>Добавление морского маршрута</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="/static/styles/sea_routes.css">
</head>

<body>

<main class="phone standard-page">

    <header class="page-header">
        Морские маршруты
    </header>


    <section class="page-content add-content">


        {{ if .hasDraft }}


        <!-- ЭТАП 2: публикация существующего черновика -->

        <h1 class="page-title">
            Публикация маршрута
        </h1>


        <p class="draft-name">
            Черновик:
            <strong>
                {{ .seaRoute.Name }}
            </strong>
        </p>


        <form
            class="route-form"
            method="POST"
            action="/sea_routes/publish">


            <!-- Видео -->

            <div class="media-field">

                <label class="media-title">
                    Видео
                </label>

                <video
                    class="media-video-preview"
                    muted
                    controls
                    poster="{{ .seaRoute.ImageURL }}">

                    <source
                        src="{{ .seaRoute.VideoURL }}"
                        type="video/mp4">

                </video>

            </div>


            <!-- Фото -->

            <div class="media-field">

                <label class="media-title">
                    Фото
                </label>

                <img
                    class="media-photo-preview"
                    src="{{ .seaRoute.ImageURL }}"
                    alt="{{ .seaRoute.Name }}">

            </div>


            <!-- Расстояние -->

            <div class="form-group">

                <label for="distance-nautical-miles">
                    Расстояние маршрута, мор. мили
                </label>

                <input
                    id="distance-nautical-miles"
                    name="distance_nautical_miles"
                    type="number"
                    min="0"
                    value="{{ with .seaRoute.DistanceNauticalMiles }}{{ . }}{{ end }}"
                    required>

            </div>


            <!-- Средняя задержка -->

            <div class="form-group">

                <label for="average-port-delay-hours">
                    Средняя задержка в портах, ч
                </label>

                <input
                    id="average-port-delay-hours"
                    name="average_port_delay_hours"
                    type="number"
                    min="0"
                    value="{{ with .seaRoute.AveragePortDelayHours }}{{ . }}{{ end }}"
                    required>

            </div>


            <!-- Краткое описание -->

            <div class="form-group">

                <label for="description">
                    Краткое описание
                </label>

                <textarea
                    id="description"
                    name="description"
                    rows="3"
                    required>{{ with .seaRoute.Description }}{{ . }}{{ end }}</textarea>

            </div>


            <button
                type="submit">
                Опубликовать
            </button>

        </form>


        {{ else }}


        <!-- ЭТАП 1: создание черновика -->

        <h1 class="page-title">
            Новый маршрут
        </h1>


        <form
            class="route-form"
            method="POST"
            action="/sea_routes/create">


            <!-- Видео -->

            <div class="media-field">

                <label class="media-title">
                    Видео
                </label>

                <video
                    class="media-video-preview"
                    src="/static/media/default-route.mp4"
                    poster="/static/media/default-route.jpg"
                    muted
                    controls>
                </video>

                <!--
                    В ЛР2 пользователь выбирает файл,
                    но сам файл на сервер ещё не отправляется.
                -->

                <input
                    class="media-file-input-visible"
                    type="file"
                    accept="video/*"
                    required>

            </div>


            <!-- Фото -->

            <div class="media-field">

                <label class="media-title">
                    Фото
                </label>

                <img
                    class="media-photo-preview"
                    src="/static/media/default-route.jpg"
                    alt="Фото морского маршрута">

                <input
                    class="media-file-input-visible"
                    type="file"
                    accept="image/*"
                    required>

            </div>


            <!-- Название -->

            <div class="form-group">

                <label for="sea-route-name">
                    Название маршрута
                </label>

                <input
                    id="sea-route-name"
                    name="sea_route_name"
                    type="text"
                    placeholder="Например: Владивосток — Пусан"
                    required>

            </div>


            <button
                type="submit">
                Далее
            </button>

        </form>


        {{ end }}


    </section>


    <!-- Нижнее меню -->

    <nav class="bottom-nav">

        <a
            href="/sea_routes/feed"
            class="nav-item">

            <span class="nav-icon">
                ⌂
            </span>

            <span>
                Лента
            </span>

        </a>


        <a
            href="/sea_routes/add"
            class="nav-item active">

            <span class="nav-icon">
                ＋
            </span>

            <span>
                Добавить
            </span>

        </a>


        <a
            href="/sea_routes/catalog"
            class="nav-item">

            <span class="nav-icon">
                ▦
            </span>

            <span>
                Каталог
            </span>

        </a>

    </nav>

</main>

</body>

</html>
